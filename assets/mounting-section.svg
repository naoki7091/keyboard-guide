<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510"><rect width="800" height="510" rx="12" fill="#f6f5ee"/><g font-family="Meiryo,sans-serif" fill="#183e31"><text x="30" y="38" font-size="22">4mm＋0.5mm＋5mmで支える薄型構造</text><text x="30" y="65" font-size="12">横寸法は模式図。縦方向の寸法は今回の組立条件。</text><rect x="160" y="368.0" width="350" height="32" fill="#42755b"/><text x="540" y="390.0" font-size="14">ボトム 1.6mm</text><rect x="160" y="246.0" width="350" height="32" fill="#42755b"/><text x="540" y="268.0" font-size="14">メイン 1.6mm</text><rect x="160" y="146.0" width="350" height="32" fill="#9db29b"/><text x="540" y="168.0" font-size="14">トップ 1.6mm</text><rect x="290" y="146.0" width="44" height="254" fill="#f6f5ee"/><rect x="268" y="246.0" width="88" height="32" fill="#f6f5ee"/><rect x="272" y="288.0" width="80" height="80" fill="#c2a563"/><rect x="272" y="178.0" width="80" height="100" fill="#c2a563"/><rect x="252" y="278.0" width="120" height="10" fill="#afb8b0"/><rect x="301" y="233.0" width="22" height="100" fill="#62746a"/><text x="40" y="328.0" font-size="14">下側4mm</text><text x="40" y="230.0" font-size="14">上側5mm</text><text x="400" y="288.0" font-size="14">支持ワッシャー</text><text x="400" y="307.0" font-size="12">OD6 / 厚0.5mm</text><text x="540" y="318.0" font-size="17">隙間4.5mm</text><text x="30" y="455" font-size="13">メインのφ4.4mm穴を上側OD4スペーサーが通り、ワッシャーで下から支持。</text><text x="30" y="480" font-size="12">連結M2×5、下M2×3・上M2×4は候補。ねじの突き当たりと嵌合は実物確認。</text></g></svg>