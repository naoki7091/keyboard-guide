<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700"><rect width="1040" height="700" rx="12" fill="#f6f5ee"/><g font-family="Meiryo,sans-serif" fill="#153e32"><text x="30" y="38" font-size="23">マイコンは表面実装せず、コンスルー＋補助4本線で装着</text><text x="30" y="68" font-size="12">接続部の局部図（外形は省略）。J54/J55は手作業、J56はSMT。実物の固定・接触は未確認。</text><text x="30" y="105" font-size="17">L / ボトム机側を上から透視</text><g transform="translate(30 126) scale(6)"><rect width="72" height="38" rx="1" fill="#285c48"/><rect x="5.4" y="3.4000000000000004" width="21.2" height="19.2" fill="#83b49b" stroke="#cce3ce" stroke-width=".2"/><circle cx="23.619999999999997" cy="5.3799999999999955" r=".75" fill="#d7b576"/><circle cx="23.619999999999997" cy="5.3799999999999955" r=".425" fill="#edf1e8"/><circle cx="21.08" cy="5.3799999999999955" r=".75" fill="#d7b576"/><circle cx="21.08" cy="5.3799999999999955" r=".425" fill="#edf1e8"/><circle cx="18.54" cy="5.3799999999999955" r=".75" fill="#d7b576"/><circle cx="18.54" cy="5.3799999999999955" r=".425" fill="#edf1e8"/><circle cx="16.0" cy="5.3799999999999955" r=".75" fill="#d7b576"/><circle cx="16.0" cy="5.3799999999999955" r=".425" fill="#edf1e8"/><circle cx="13.46" cy="5.3799999999999955" r=".75" fill="#d7b576"/><circle cx="13.46" cy="5.3799999999999955" r=".425" fill="#edf1e8"/><circle cx="10.920000000000002" cy="5.3799999999999955" r=".75" fill="#d7b576"/><circle cx="10.920000000000002" cy="5.3799999999999955" r=".425" fill="#edf1e8"/><circle cx="8.380000000000003" cy="5.3799999999999955" r=".75" fill="#d7b576"/><circle cx="8.380000000000003" cy="5.3799999999999955" r=".425" fill="#edf1e8"/><text x="7.380000000000003" y="3.5799999999999956" font-size="2.1" fill="#f5f1d8">J54.1</text><circle cx="8.380000000000003" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="8.380000000000003" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="10.920000000000002" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="10.920000000000002" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="13.46" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="13.46" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="16.0" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="16.0" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="18.54" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="18.54" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="21.08" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="21.08" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="23.619999999999997" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="23.619999999999997" cy="20.620000000000005" r=".425" fill="#edf1e8"/><text x="22.619999999999997" y="18.820000000000004" font-size="2.1" fill="#f5f1d8">J55.1</text><rect x="33.7" y="26.7" width=".6" height="1.6" fill="#f0d08c"/><rect x="34.7" y="26.7" width=".6" height="1.6" fill="#f0d08c"/><rect x="35.7" y="26.7" width=".6" height="1.6" fill="#f0d08c"/><rect x="36.7" y="26.7" width=".6" height="1.6" fill="#f0d08c"/><text x="33.0" y="25.7" font-size="2.1" fill="#f5f1d8">J56.1</text><text x="10.0" y="14.0" font-size="2.2" fill="#173b2e">XIAO / U1</text></g><text x="540" y="105" font-size="17">R / ボトム机側を上から透視</text><g transform="translate(540 126) scale(6)"><rect width="72" height="38" rx="1" fill="#285c48"/><rect x="19.4" y="3.4000000000000004" width="21.2" height="19.2" fill="#83b49b" stroke="#cce3ce" stroke-width=".2"/><circle cx="22.379999999999995" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="22.379999999999995" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="24.920000000000016" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="24.920000000000016" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="27.460000000000008" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="27.460000000000008" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="30.0" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="30.0" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="32.53999999999999" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="32.53999999999999" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="35.08000000000001" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="35.08000000000001" cy="20.620000000000005" r=".425" fill="#edf1e8"/><circle cx="37.620000000000005" cy="20.620000000000005" r=".75" fill="#d7b576"/><circle cx="37.620000000000005" cy="20.620000000000005" r=".425" fill="#edf1e8"/><text x="36.620000000000005" y="18.820000000000004" font-size="2.1" fill="#f5f1d8">J54.1</text><circle cx="37.620000000000005" cy="5.38000000000001" r=".75" fill="#d7b576"/><circle cx="37.620000000000005" cy="5.38000000000001" r=".425" fill="#edf1e8"/><circle cx="35.08000000000001" cy="5.38000000000001" r=".75" fill="#d7b576"/><circle cx="35.08000000000001" cy="5.38000000000001" r=".425" fill="#edf1e8"/><circle cx="32.53999999999999" cy="5.38000000000001" r=".75" fill="#d7b576"/><circle cx="32.53999999999999" cy="5.38000000000001" r=".425" fill="#edf1e8"/><circle cx="30.0" cy="5.38000000000001" r=".75" fill="#d7b576"/><circle cx="30.0" cy="5.38000000000001" r=".425" fill="#edf1e8"/><circle cx="27.460000000000008" cy="5.38000000000001" r=".75" fill="#d7b576"/><circle cx="27.460000000000008" cy="5.38000000000001" r=".425" fill="#edf1e8"/><circle cx="24.920000000000016" cy="5.38000000000001" r=".75" fill="#d7b576"/><circle cx="24.920000000000016" cy="5.38000000000001" r=".425" fill="#edf1e8"/><circle cx="22.379999999999995" cy="5.38000000000001" r=".75" fill="#d7b576"/><circle cx="22.379999999999995" cy="5.38000000000001" r=".425" fill="#edf1e8"/><text x="21.379999999999995" y="3.58000000000001" font-size="2.1" fill="#f5f1d8">J55.1</text><rect x="8.7" y="33.10000000000001" width=".6" height="1.6" fill="#f0d08c"/><rect x="9.7" y="33.10000000000001" width=".6" height="1.6" fill="#f0d08c"/><rect x="10.7" y="33.10000000000001" width=".6" height="1.6" fill="#f0d08c"/><rect x="11.7" y="33.10000000000001" width=".6" height="1.6" fill="#f0d08c"/><text x="8.0" y="32.10000000000001" font-size="2.1" fill="#f5f1d8">J56.1</text><text x="24.0" y="14.0" font-size="2.2" fill="#173b2e">XIAO / U1</text></g><text x="30" y="385" font-size="16">側面14穴：2.54mmピッチ、列間15.24mm</text><text x="30" y="411" font-size="13">ボトムの接触穴φ0.85mm。XIAOの丸穴はφ1.0mm。</text><text x="30" y="437" font-size="13">コンスルー候補：XB-3-3.5-7Pを2本／片手</text><text x="30" y="463" font-size="11">XIAO側の固定方法は現物で確認。両側の無はんだ接続は前提にしません。</text><text x="30" y="511" font-size="16">断面：メイン〜ボトム4.5mmとは別の寸法</text><rect x="50" y="535" width="400" height="22" fill="#42755b"/><rect x="90" y="557" width="12" height="49" fill="#c2a563"/><rect x="355" y="557" width="12" height="49" fill="#c2a563"/><rect x="75" y="606" width="310" height="16" fill="#83b49b"/><rect x="110" y="622" width="140" height="28" fill="#9aaca5"/><text x="325" y="530" font-size="12">ボトム 1.6mm</text><text x="140" y="585" font-size="13">間隔候補3.5mm</text><text x="400" y="620" font-size="12">XIAO</text><text x="550" y="385" font-size="17">J56の4本線：番号で照合</text><text x="550" y="417" font-size="14">1 → BAT+（電源／ランド28）</text><text x="550" y="448" font-size="14">2 → Reset（ランド26）</text><text x="550" y="479" font-size="14">3 → D17 / Col5（側面半穴21）</text><text x="550" y="510" font-size="14">4 → D18 / Col6（側面半穴22）</text><text x="550" y="563" font-size="13">GNDは側面13番で接続。</text><text x="550" y="589" font-size="12">USB・電池を外してからJ56とマイコンを抜きます。</text><text x="30" y="680" font-size="12">寸法・位置を説明する模式図。マイコンと4本線の準備・接点の実証は未実施です。</text></g></svg>